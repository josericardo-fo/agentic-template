name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # toolchain steps (inserted by /new-project)

      - name: Setup
        run: if [ -x scripts/setup ]; then ./scripts/setup; fi

      # Mesmo gate do hook de Stop.
      - name: Check
        run: ./scripts/check

      - name: Build
        run: if [ -x scripts/build ]; then ./scripts/build; fi

  # Varredura de segredos no histórico (gratuita para repos de conta pessoal).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
